name: Build and release Windows app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v0.3.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)(?:-([0-9A-Za-z.-]+))?$') {
            throw 'Expected a version tag such as v0.3.1 or v0.3.1-beta.1'
          }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Tag does not exist' }
          "APP_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
          "RELEASE_TAG=$env:RELEASE_TAG" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }

      - name: Publish desktop app
        shell: pwsh
        run: |
          dotnet publish desktop/Ash.Nexus.csproj -c Release -r win-x64 --self-contained false -p:SkipFrontendBuild=true "-p:Version=$env:APP_VERSION" -o artifacts/app
          if ($LASTEXITCODE -ne 0) { throw 'Desktop publish failed' }
          Copy-Item README.md, README.en.md, LICENSE artifacts/app/
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/ASH-$env:RELEASE_TAG-windows-x64.zip"
          $zip = Get-Item "artifacts/ASH-$env:RELEASE_TAG-windows-x64.zip"
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ASH-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--generate-notes', '--title', "ASH $env:RELEASE_TAG")
            if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
            & gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG "artifacts/ASH-$env:RELEASE_TAG-windows-x64.zip" artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
